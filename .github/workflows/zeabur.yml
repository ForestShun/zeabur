name: zeabur
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: zeabur
  cancel-in-progress: true 

jobs:
  zeabur:
    runs-on: ubuntu-latest
    steps:
      - name: 恢复全局系统缓存
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: zeabur-state.tar.gz
          key: zeabur

      - name: 还原全局状态并唤醒服务
        if: steps.cache-restore.outputs.cache-hit == 'true'
        run: |
          echo "开始还原系统全局状态..."
          sudo tar -xzf zeabur-state.tar.gz -C / || true
          
          echo "重载系统服务..."
          sudo systemctl daemon-reload
          
          # 自动唤醒所有可能被 Zeabur 安装的关键服务
          sudo systemctl start tailscaled || true
          sudo systemctl start ssh || true
          # 动态查找并启动所有 k3s 相关的服务
          for svc in $(systemctl list-unit-files | grep -E '^k3s.*\.service' | awk '{print $1}'); do
            echo "尝试唤醒服务: $svc"
            sudo systemctl enable --now "$svc" || true
          done

      - name: 验证与安装基础脚本
        run: |
          # 即使已还原，再跑一次官方脚本确保底层依赖就绪（官方脚本有幂等性，已有环境会跳过）
          curl -fsSL 'https://api.zeabur.com/mesh-server/install.sh?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjE3NzYzMzE0MzcsImlhdCI6MTc3NjMwMjYzNywiaXNzIjoiemVhYnVyLW1lc2giLCJzZXJ2ZXJfaWQiOiI2OWUwM2EyYmJhZTRhZjU4MjgxNmM4ZmEifQ.9ywJUJsKWimHxAjS1LSsyTjZaz_TFcLcfigjRju7Edc' | sudo bash

      - name: 维持连接
        run: |
          echo "Mesh IP: $(tailscale ip -4)"
          while true; do
            if ! systemctl is-active --quiet tailscaled; then
                echo "网络服务丢失"
                exit 1
            fi
            echo "[$(date -u)] 节点在线 | $(hostname)"
            sleep 3600
          done

      - name: 全局状态打包 (深度备份)
        if: always()
        run: |
          echo "正在打包全局环境..."
          # 备份核心配置、第三方软件、数据存储
          # 排除 socket、系统自带包管理器缓存、动态网络配置以防系统崩溃
          sudo tar --exclude='*.sock' \
                   --exclude='/var/lib/apt' \
                   --exclude='/var/lib/dpkg' \
                   --exclude='/var/cache' \
                   --exclude='/etc/resolv.conf' \
                   --exclude='/etc/hosts' \
                   --exclude='/etc/hostname' \
                   -czf zeabur-state.tar.gz \
                   /etc \
                   /var/lib \
                   /usr/local \
                   /opt \
                   /root \
                   2>/dev/null || true

      - name: 保存全局系统缓存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: zeabur-state.tar.gz
          key: zeabur

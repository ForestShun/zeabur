name: zeabur
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: zeabur
  cancel-in-progress: true 

jobs:
  zeabur:
    runs-on: ubuntu-latest
    env:
      # 请在 GitHub 仓库的 Settings -> Secrets and variables -> Actions 中添加名为 WONDER_MESH 的 Secret
      WONDER_MESH: ${{ secrets.WONDER_MESH }}

    steps:
      - name: 神奇工具
        run: |
          eval "$WONDER_MESH"
          
          echo "重启网络与代理服务..."
          sudo systemctl daemon-reload
          
          for i in {1..60}; do
            if tailscale ip -4 >/dev/null 2>&1; then
              echo "tailscale: $(tailscale ip -4)"
              break
            fi
            sleep 2
          done
      
      - name: 恢复缓存
        id: zeabur
        uses: actions/cache/restore@v4
        with:
          path: zeabur.tar.gz
          key: zeabur-${{ github.run_id }} 
          restore-keys: |
            zeabur-

      - name: 还原文件
        run: |
          if [ -f zeabur.tar.gz ]; then
            echo "检测到备份文件，开始还原..."
            sudo tar -xzf zeabur.tar.gz -C / || true
          else
            echo "未发现备份文件，跳过还原..."
          fi

      - name: 唤醒启动
        run: |

          echo "重载服务..."
          sudo systemctl enable --now k3s || true
          
          echo "等待响应..."
          for i in {1..60}; do
            if sudo k3s kubectl get node >/dev/null 2>&1; then
              echo -e "\n[OK] K3s 已就绪，正在重建..."
              sudo k3s kubectl delete pods --all -A --force --grace-period=0 || true
              break
            fi
            echo -n "."
            sleep 2
          done

      - name: 维持运行
        run: |
          while true; do
            if ! systemctl is-active --quiet tailscaled; then 
              echo "Tailscale 掉线，尝试重启..."
              sudo systemctl restart tailscaled || true
              sleep 5
              if ! systemctl is-active --quiet tailscaled; then exit 1; fi
            fi
            echo "[$(date -u)] 状态正常 | $(hostname)"
            sleep 300
          done

      - name: 备份文件
        if: always()
        run: |
          echo "备份中..."
          sudo systemctl stop k3s || true
          
          sudo tar --exclude='*.sock' \
            --exclude='*/containerd/*' \
            -czf zeabur.tar.gz \
            /usr/local/bin/k3s* \
            /etc/systemd/system/k3s.service \
            /etc/systemd/system/k3s.service.env \
            /etc/rancher/k3s \
            /var/lib/rancher/k3s \
            2>/dev/null || true

      - name: 保存缓存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: zeabur.tar.gz
          key: zeabur-${{ github.run_id }}

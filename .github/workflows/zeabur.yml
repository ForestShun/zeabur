name: zeabur
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: zeabur
  cancel-in-progress: true 

jobs:
  zeabur:
    runs-on: ubuntu-latest
    steps:
      - name: 恢复缓存
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: z-state.tar.gz
          key: z-id-${{ github.run_id }} 
          restore-keys: |
            z-id-

      - name: 还原文件 (不启动)
        # 删掉 if: steps.cache-restore.outputs.cache-hit == 'true'
        run: |
          if [ -f z-state.tar.gz ]; then
            echo "检测到备份文件，开始还原系统状态..."
            sudo tar -xzf z-state.tar.gz -C / || true
          else
            echo "未发现备份文件，将进行纯净安装。"
          fi

      - name: 基础安装 (启动网络)
        run: |
          # 这一步会启动 Tailscale，确保 100.64 IP 出现
          curl -fsSL 'https://api.zeabur.com/mesh-server/install.sh?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjE3NzYzMzMwMzUsImlhdCI6MTc3NjMwNDIzNSwiaXNzIjoiemVhYnVyLW1lc2giLCJzZXJ2ZXJfaWQiOiI2OWUwNDA2OWJhZTRhZjU4MjgxNmM4ZmMifQ.MrdUphbWF-kdWhtYOOMpxQ-hQ0jvFDR4LQt3n3vCZw8' | sudo bash
      - name: 唤醒 K3s 与破冰清理
        run: |
          echo "重载并正式启动 K3s 服务..."
          sudo systemctl daemon-reload
          if [ -f /etc/systemd/system/k3s.service ]; then
              sudo systemctl enable --now k3s || true
              
              echo "等待 K3s API 响应 (基于已就绪的网络)..."
              for i in {1..60}; do
                if sudo k3s kubectl get node >/dev/null 2>&1; then
                  echo -e "\n[OK] K3s 已就绪，正在触发容器原地重建..."
                  # 清理旧机器留下的假死容器
                  sudo k3s kubectl delete pods --all -A --force --grace-period=0 || true
                  break
                fi
                echo -n "."
                sleep 2
              done
          fi

      - name: 维持运行
        run: |
          echo "节点在线: $(tailscale ip -4)"
          while true; do
            if ! systemctl is-active --quiet tailscaled; then exit 1; fi
            echo "[$(date -u)] 状态正常 | $(hostname)"
            sleep 3600
          done

      - name: 精准打包
        if: always()
        run: |
          echo "正在备份当前节点状态..."
          sudo tar --exclude='*.sock' -czf z-state.tar.gz \
            /var/lib/tailscale \
            /usr/local/bin/wonder \
            /etc/ssh/sshd_config.d \
            /usr/local/bin/k3s* \
            /etc/systemd/system/k3s.service \
            /etc/systemd/system/k3s.service.env \
            /etc/rancher/k3s \
            /var/lib/rancher/k3s \
            2>/dev/null || true

      - name: 保存缓存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: z-state.tar.gz
          key: z-id-${{ github.run_id }}

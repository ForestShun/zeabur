name: zeabur
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: zeabur
  cancel-in-progress: true 

jobs:
  zeabur:
    runs-on: ubuntu-latest
    steps:
      - name: 恢复身份
        uses: actions/cache/restore@v4
        with:
          path: |
            /var/lib/tailscale
            /usr/local/bin/wonder
            /etc/ssh/sshd_config.d
          key: zeabur

      - name: 安装脚本
        run: |
          curl -fsSL 'https://api.zeabur.com/mesh-server/install.sh?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjE3NzYyNDY5NTMsImlhdCI6MTc3NjIxODE1MywiaXNzIjoiemVhYnVyLW1lc2giLCJzZXJ2ZXJfaWQiOiI2OWRlZjAyNTlkOWM2NjYyODM5YTRmNGYifQ.ppB3WnKmUMZQVFol_B7vNTCHzoeeM139fQD6V82vv74' | sudo bash

      - name: 维持连接
        run: |
          echo "Mesh IP: $(tailscale ip -4)"
          while true; do
            # 基础健康检测
            if ! systemctl is-active --quiet tailscaled; then
                echo "网络服务丢失"
                exit 1
            fi
            
            # 仅在 K3s 启动后输出日志
            if systemctl is-active --quiet k3s; then
                echo "--- K3s 已启动，最近日志 ---"
                sudo journalctl -u k3s --no-pager -n 10
            fi

            echo "[$(date -u)] 节点运行中 | $(hostname)"
            
            # 设置为 1 小时检测一次，极其安静
            sleep 3600
          done

      - name: 保存身份
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            /var/lib/tailscale
            /usr/local/bin/wonder
            /etc/ssh/sshd_config.d
          key: zeabur

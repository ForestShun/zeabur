name: zeabur
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: zeabur
  cancel-in-progress: true 

jobs:
  zeabur:
    runs-on: ubuntu-latest
    steps:
      - name: 恢复缓存 (自动寻找最新版本)
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: z-state.tar.gz
          # 尝试找当前的精确 ID，找不到就往下看 restore-keys
          key: z-id-${{ github.run_id }} 
          restore-keys: |
            z-id-

      - name: 还原与唤醒
        if: steps.cache-restore.outputs.cache-hit == 'true' || steps.cache-restore.outputs.cache-primary-key != steps.cache-restore.outputs.cache-matched-key
        run: |
          echo "解压 1.5G+ 的系统状态包 (请耐心等待)..."
          sudo tar -xzf z-state.tar.gz -C / || true
          
          echo "重载并唤醒 K3s..."
          sudo systemctl daemon-reload
          if [ -f /etc/systemd/system/k3s.service ]; then
              sudo systemctl enable --now k3s || true
          fi

      - name: 基础安装
        run: |
          curl -fsSL 'https://api.zeabur.com/mesh-server/install.sh?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjE3NzYzMzMwMzUsImlhdCI6MTc3NjMwNDIzNSwiaXNzIjoiemVhYnVyLW1lc2giLCJzZXJ2ZXJfaWQiOiI2OWUwNDA2OWJhZTRhZjU4MjgxNmM4ZmMifQ.MrdUphbWF-kdWhtYOOMpxQ-hQ0jvFDR4LQt3n3vCZw8' | sudo bash
      - name: 维持运行
        run: |
          echo "Mesh IP: $(tailscale ip -4)"
          while true; do
            if ! systemctl is-active --quiet tailscaled; then
                exit 1
            fi
            echo "[$(date -u)] 节点在线 | $(hostname)"
            sleep 3600
          done

      - name: 精准打包
        if: always()
        run: |
          echo "正在打包容器数据及配置..."
          # 忽略 sock 文件以防报错，打包核心 8 大路径
          sudo tar --exclude='*.sock' -czf z-state.tar.gz \
            /var/lib/tailscale \
            /usr/local/bin/wonder \
            /etc/ssh/sshd_config.d \
            /usr/local/bin/k3s* \
            /etc/systemd/system/k3s.service \
            /etc/systemd/system/k3s.service.env \
            /etc/rancher/k3s \
            /var/lib/rancher/k3s \
            2>/dev/null || true

      - name: 保存最新缓存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: z-state.tar.gz
          # 每次保存都带上本次的唯一运行 ID，确保必定保存成功
          key: z-id-${{ github.run_id }}
